name: Daily Partitioned Catalog Ingestion

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Specific category to scrape (leave empty for daily auto-partition)'
        required: false
        default: ''

jobs:
  partitioned-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          playwright install --with-deps chromium

      - name: Run Partitioned Scrape by Day
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # If triggered manually with a category, run that category
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python -m scrapers.runner --category="${{ github.event.inputs.category }}"
            exit 0
          fi

          # Day of week (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 7=Sun)
          DOW=$(date +%u)

          case $DOW in
            1)
              echo "Monday: Ingesting Corporate Unrestricted & Employer Tuition Benefits"
              python -m scrapers.runner --category=corporate_unrestricted
              python -m scrapers.runner --category=employer_tuition_benefit
              ;;
            2)
              echo "Tuesday: Ingesting National Associations & Accrediting Bodies"
              python -m scrapers.runner --category=national_association
              python -m scrapers.runner --category=accrediting_body
              python -m scrapers.runner --category=honor_society
              ;;
            3)
              echo "Wednesday: Ingesting Hospital Systems & Clinical Employee Pipelines"
              python -m scrapers.runner --category=hospital_system
              python -m scrapers.runner --category=clinical_employee_pipeline
              ;;
            4)
              echo "Thursday: Ingesting Diversity/Affinity & Government Employee Programs"
              python -m scrapers.runner --category=diversity_affinity
              python -m scrapers.runner --category=government_employee_benefit
              python -m scrapers.runner --category=state_agency
              ;;
            5)
              echo "Friday: Ingesting Hyper-Local & Regional Foundations"
              python -m scrapers.runner --category=regional_foundation --state=OH
              python -m scrapers.runner --category=regional_foundation --state=PA
              python -m scrapers.runner --category=chamber_of_commerce
              ;;
            6)
              echo "Saturday: Running Outside Aid & AcademicWorks Seed Crawl"
              python -m scrapers.runner --crawl --seeds-file=scrapers/seeds.json --max-depth=2 --limit-extract=50
              ;;
            7)
              echo "Sunday: Full Link Audit & Dead URL Repair"
              python -m scripts.repair_urls
              ;;
          esac

      - name: Nightly Link & Deadline Maintenance
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m scripts.repair_urls

      - name: Send Weekly Student Deadline Digests (Sundays Only)
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "$(date +%u)" -eq 7 ]; then
            python -m app.workers.deadline_digest
          else
            echo "Skipping digests (runs on Sundays)."
          fi