name: GrantRx Catalog Maintenance

on:
  schedule:
    # One authoritative scheduled catalog workflow. Runs daily at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional category to scrape instead of the daily partition'
        required: false
        default: ''
      limit:
        description: 'Optional max number of sources for a manually selected category'
        required: false
        default: ''
      skip_maintenance:
        description: 'Skip link/deadline maintenance for this manual run'
        required: false
        type: boolean
        default: false

concurrency:
  group: grantrx-catalog-maintenance
  cancel-in-progress: false

jobs:
  catalog-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          playwright install --with-deps chromium

      - name: Run scheduled partition or manual category
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          CATEGORY='${{ github.event.inputs.category }}'
          LIMIT='${{ github.event.inputs.limit }}'

          if [ -n "$CATEGORY" ]; then
            LIMIT_ARG=""
            if [ -n "$LIMIT" ]; then
              LIMIT_ARG="--limit=$LIMIT"
            fi
            echo "Manual run: $CATEGORY $LIMIT_ARG"
            python -m scrapers.runner --category="$CATEGORY" $LIMIT_ARG
            exit 0
          fi

          # C7: registry-driven scheduling. The source registry decides which
          # sources are due — every enabled source has a deterministic
          # next_check_at, so no category can silently stop being scheduled.
          python -m scrapers.runner --sync

          case "$(date +%u)" in
            6)
              echo 'Saturday: due sources + discovery seed queue'
              python -m scrapers.runner --due
              python -m scrapers.runner --dynamic-queue --queue-limit=20 --limit-extract=50
              ;;
            *)
              echo 'Daily: registry-scheduled source checks'
              python -m scrapers.runner --due
              ;;
          esac

      - name: Run link and deadline maintenance once
        if: ${{ github.event_name == 'schedule' || github.event.inputs.skip_maintenance != 'true' }}
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.repair_urls

      - name: Send weekly student deadline digests
        if: ${{ github.event_name == 'schedule' }}
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "$(date +%u)" -eq 7 ]; then
            python -m app.workers.deadline_digest
          else
            echo 'Skipping digest; Sunday only.'
          fi
